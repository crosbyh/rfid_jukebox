# Owlbox — Crosby's build of the RFID jukebox (fork: crosbyh/rfid_jukebox).
# Derived from esphome/jukebox.yaml. Differences:
#   - DHCP instead of upstream's 192.168.1.x static IP (reserve an address in UniFi)
#   - API encryption + OTA password from !secret (add the keys to secrets.yaml)
#   - media player named "Speaker" -> media_player.owlbox_speaker in HA
#   - ma_entity points at Music Assistant's player for this device
#   - log level INFO
#   - hardware is a Louder-ESP32 *Plus* Rev B (classic ESP32-WROVER-E N8R8,
#     TAS5825M amp), not upstream's Louder-ESP32-S3 (TAS5805M). Board settings,
#     amp pins and the tas58xx driver follow Sonocotta's
#     firmware/esphome/7-louder-esp32-plus/louder-esp32-plus-idf.yaml
#   - the IR receiver is removed so its GPIO39 can take the encoder; the
#     OLED pins are only on the ZIF connector, so the knob press uses the
#     mic footprints' SD 13 hole
# Every "TODO(owlbox)" must be checked against the real wiring or entity IDs
# before flashing.
substitutions:
  name: owlbox
  friendly_name: Owlbox
  task_stack_in_psram: "false" # must be false on the classic ESP32
  # Amp wiring is fixed on the board
  i2s_lrclk_pin: GPIO25
  i2s_bclk_pin: GPIO26
  i2s_dout_pin: GPIO22
  tas58xx_enable_pin: GPIO33
  i2c_sda_pin: GPIO21
  i2c_scl_pin: GPIO27
  # TODO(owlbox): confirm every pin below against the as-built wiring
  pn532_sclk: GPIO18 # W5500 ETH header - 18 CLK
  pn532_miso: GPIO19 # W5500 ETH header - 19 MISO
  pn532_mosi: GPIO23 # W5500 ETH header - 23 MOSI
  pn532_cs: GPIO15   # W5500 ETH header - 15 CS
  encoder_a_pin: GPIO35 # KY-040 CLK -> W5500 ETH header - 35 INT (input only)
  encoder_b_pin: GPIO39 # KY-040 DT -> IR IN header - 39 (input only, IR receiver removed)
  encoder_btn: GPIO13   # KY-040 SW -> SD 13 hole on either mic footprint
  btn_prev_pin: GPIO14  # W5500 ETH header - 14 RST; other leg to GND
  btn_next_pin: GPIO12  # RGB OUT header - 12; other leg to GND. Strapping pin, safe because the button only pulls low
  # TODO(owlbox): the Music Assistant player entity HA creates for this
  # device once it is added to MA's hass_players provider
  ma_entity: media_player.owlbox_speaker_2
  default_volume: "0.5"
  
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.12.2
  name_add_mac_suffix: false
  platformio_options:
    board_build.flash_mode: dio
  # Importnant! Play sound on boot required for DAC to capture clock signal and enable DSP configuration
  # If any of the DSP configs are sent before clock signal, they are simply ignored. This applies to EQ and Mixer controls
  on_boot:
    priority: 220.0
    then:
      media_player.speaker.play_on_device_media_file: startup_sync_sound

esp32:
  variant: esp32
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true
    sdkconfig_options:
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"

      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"  # TLS1.3 support isn't enabled by default in IDF 5.1.5

# Enable logging
logger:
  level: INFO
  
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
#  ap:
#    ssid: "$name Hotspot"
#    password: !secret esphome_ap_password
  power_save_mode: none   # lowers latency/jitter for streaming
  # DHCP; reserve an address for the device in UniFi instead of manual_ip

captive_portal:

# Allow Over-The-Air updates
ota:
  platform: esphome
  password: !secret owlbox_ota_password

# Enable Home Assistant API
api:
  encryption:
    key: !secret owlbox_api_key

psram:
  speed: 80MHz

# network:
#   enable_ipv6: true

external_components:
  - source: github://mrtoy-me/esphome-tas58xx@main
    components: [ tas58xx ]
    refresh: 48h
  # - source: github://c-MM/esphome-snapclient
  #   components: [ snapclient ]
  #   refresh: 0s

globals:
  - id: current_volume
    type: float
  - id: tag_present
    type: bool
    initial_value: 'false'
i2c:
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  frequency: 400kHz
  scan: True

### TAS5825M DAC configuration
audio_dac:
  - platform: tas58xx
    id: tas58xx_dac
    tas58xx_dac: TAS5825M
    enable_pin: ${tas58xx_enable_pin}  # Physical pin connected to PWDN pin
    dac_mode: BTL       # 'BTL' / Bridge Tied Load - 2Ch Stereo, or 'PBTL' / Parallel Bridge Tied Load - 1Ch Mono (double power)
    mixer_mode: STEREO  # STEREO, STEREO_INVERSE, MONO, LEFT, RIGHT
    analog_gain: -9db   # Startup Gain or Output voltage swing - pick based on the power supply voltage: https://github.com/sonocotta/esp32-tas5805m-dac?tab=readme-ov-file#digital-volume-and-analog-gain
    volume_max: -12dB    # Max HA volume mapping to Digital Volume control, goes as high as +24dB, but not recommend going much above 0 dB, risking to cause clipping on high volume
    volume_min: -60db   # Min HA volume mapping to Digital Volume control, goes as low as -103dB, but prefer to set higher to have a reasonable volume range
    update_interval: 5s # How often fault registers are read and cleared

i2s_audio:
  i2s_lrclk_pin: ${i2s_lrclk_pin}
  i2s_bclk_pin: ${i2s_bclk_pin}

### Snapclient component is a work in progress, not yet ready for production use
# Will be updated, as soon as snapclient component is ready
# snapclient:
#   hostname: 192.168.1.49
#   port: 1704
#   name: $friendly_name
#   audio_dac: tas58xx_dac
#   i2s_dout_pin: ${i2s_dout_pin}
#   webserver_port: 8080  # start webserver for equalizer

speaker:
  - platform: i2s_audio
    id: speaker_id
    dac_type: external
    i2s_dout_pin: ${i2s_dout_pin}
    audio_dac: tas58xx_dac
    channel: stereo
    sample_rate: 48000
    timeout: never
    buffer_duration: 100ms

  - platform: mixer
    id: mixer_speaker_id
    task_stack_in_psram: ${task_stack_in_psram}
    output_speaker: speaker_id
    source_speakers:
      - id: announcement_spk_mixer_input
        timeout: never
      - id: media_spk_mixer_input
        timeout: never

  - platform: resampler
    id: media_spk_resampling_input
    task_stack_in_psram: ${task_stack_in_psram}
    output_speaker: media_spk_mixer_input
    
  - platform: resampler
    id: announcement_spk_resampling_input
    task_stack_in_psram: ${task_stack_in_psram}
    output_speaker: announcement_spk_mixer_input

media_player:
  - platform: speaker
    name: Speaker
    id: louder_mediaplayer
    task_stack_in_psram: ${task_stack_in_psram}
    buffer_size: 40960
    volume_increment: 2%
    volume_initial: 50%
    volume_max: 80%
    media_pipeline:
      speaker: media_spk_resampling_input
      num_channels: 2
      format: NONE   
    announcement_pipeline:
      speaker: announcement_spk_resampling_input
      num_channels: 1
      format: NONE   

    files:
      id: startup_sync_sound
      file: https://github.com/mrtoy-me/esphome-tas58xx/raw/main/components/tas58xx/silent_boot.flac

    on_play:
      - if:
          condition:
            switch.is_off: enable_louder
          then:
            switch.turn_on: enable_louder

    on_announcement:
      - if:
          condition:
            switch.is_off: enable_louder
          then:
            switch.turn_on: enable_louder
          
      - lambda: id(current_volume) = id(tas58xx_dac).volume();

      - mixer_speaker.apply_ducking:
            id: media_spk_mixer_input
            decibel_reduction: 40
            duration: 0.0s
      - wait_until:
            media_player.is_announcing:
      - delay: 0.75s
      - lambda: id(tas58xx_dac).set_volume(id(announce_volume).state / 100);

      - wait_until:
          not:
            media_player.is_announcing:
      - mixer_speaker.apply_ducking:
            id: media_spk_mixer_input
            decibel_reduction: 0
            duration: 1.0s
      - lambda: id(tas58xx_dac).set_volume(id(current_volume));

switch:
  - platform: tas58xx
    # Will be operated automatially. When disabled DAC will drow dramatically less power
    enable_dac:
      name: Enable Louder
      id: enable_louder
      restore_mode: ALWAYS_ON

select:
  - platform: tas58xx
    eq_mode:
      name: EQ Mode

number:
  # Volume for announcements only
  - platform: template
    name: Announce Volume
    id: announce_volume
    icon: mdi:volume-source
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    restore_value: true
    initial_value: 50
    optimistic: true

  ### 15 Band EQ. At this point frequency and bandwidth are hard-wired, since BQ coefficients table are not calculated on the fly
  # Each band regulates within [-15dB .. +15 dB] range
  # Each band overlaps with nearby bands, so with extreme settings it can go as high or low as -/+30dB, so use with care
  - platform: tas58xx
    left_eq_gain_20Hz:
      name: Left ---20Hz
    left_eq_gain_31.5Hz:
      name: Left ---31.5Hz
    left_eq_gain_50Hz:
      name: Left ---50Hz
    left_eq_gain_80Hz:
      name: Left ---80Hz
    left_eq_gain_125Hz:
      name: Left --125Hz
    left_eq_gain_200Hz:
      name: Left --200Hz
    left_eq_gain_315Hz:
      name: Left --315Hz
    left_eq_gain_500Hz:
      name: Left --500Hz
    left_eq_gain_800Hz:
      name: Left --800Hz
    left_eq_gain_1250Hz:
      name: Left -1250Hz
    left_eq_gain_2000Hz:
      name: Left -2000Hz
    left_eq_gain_3150Hz:
      name: Left -3150Hz
    left_eq_gain_5000Hz:
      name: Left -5000Hz
    left_eq_gain_8000Hz:
      name: Left -8000Hz
    left_eq_gain_16000Hz:
      name: Left 16000Hz

### Faults clear registers read from TAS5825M
# Every time fault is detected, it will be reported to HA and clears afterwards
# This is to ensure that device will not stuck in the fault state until reboot
sensor:
  - platform: tas58xx
    faults_cleared:
      name: "Times Faults Cleared"
    update_interval: 60s
  - platform: rotary_encoder
    name: "${friendly_name} Encoder"
    pin_a:
      number: ${encoder_a_pin}
      mode: INPUT  # no internal pull-ups on 35/39; the KY-040 has its own 10k pull-ups
      inverted: true
    pin_b:
      number: ${encoder_b_pin}
      mode: INPUT
      inverted: true
    resolution: 2
    filters:
      - throttle: 50ms
    on_clockwise:
      - if:
          condition:
            lambda: 'return !id(louder_mediaplayer).is_muted();'
          then:
            - media_player.volume_up:
                id: louder_mediaplayer
    on_anticlockwise:
      - if:
          condition:
            lambda: 'return !id(louder_mediaplayer).is_muted();'
          then:
            - media_player.volume_down:
                id: louder_mediaplayer
  - platform: wifi_signal
    name: "${friendly_name} Wifi Signal"
    update_interval: 60s  # Serves as heartbeat to avoid disconnection to MA

### Faults registers read directly from TAS5825M
# TODO: Over Temperature Warning -> reduce volume automatically before it goes into shutdown
binary_sensor:
  - platform: tas58xx
    have_fault:
      name: Any Faults
      exclude: CLOCK_FAULT  # the speaker media player toggles I2S, which trips spurious clock faults
    left_channel_dc_fault:
      name: Left Channel DC Fault
    right_channel_dc_fault:
      name: Right Channel DC Fault
    left_channel_over_current:
      name: Left Channel Over Current
    right_channel_over_current:
      name: Right Channel Over Current
    otp_crc_check:
      name: CRC Check Fault
    bq_write_failed:
      name: BQ Write Failure
    pcdd_over_voltage:
      name: PCDD Over Voltage
    pcdd_under_voltage:
      name: PCDD Under Voltage
    over_temp_shutdown:
      name: Over Temperature Shutdown Fault
    over_temp_warning:
      name: Over Temperature Warning
      id: over_temperature_warning

  - platform: gpio
    name: "${friendly_name} Prev Button"
    pin:
      number: ${btn_prev_pin}
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      - if:
          condition:
            lambda: 'return id(tag_present);'
          then:
            - homeassistant.action:
                action: media_player.media_previous_track
                data:
                  entity_id: ${ma_entity}

  - platform: gpio
    name: "${friendly_name} Next Button"
    pin:
      number: ${btn_next_pin}
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      - if:
          condition:
            lambda: 'return id(tag_present);'
          then:
            - homeassistant.action:
                action: media_player.media_next_track
                data:
                  entity_id: ${ma_entity}
                  
### Add pin to use the built in rotary endcoder button
  - platform: gpio
    name: "${friendly_name} Encoder Button"
    pin:
      number: ${encoder_btn}
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      - homeassistant.action:
          action: media_player.media_play_pause
          data:
            entity_id: ${ma_entity}

### Send DAC to shutdown mode after 2 minutes of inactivity
# This is to save power, since DAC will draw under 100mA in idle state
interval:
  - interval: 30s
    then:
      - if:
          condition:
            - switch.is_on: enable_louder
            - for:
                time: 120s
                condition:
                  or:
                    - media_player.is_idle: louder_mediaplayer
                    - media_player.is_paused: louder_mediaplayer
          then:
            - switch.turn_off: enable_louder
  # Optional: when DAC reports overheating warning, reduce volume to prevent shutdown
  - interval: 1s
    then:
      - if:
          condition:
            - binary_sensor.is_on: over_temperature_warning
            - lambda: 'return (id(louder_mediaplayer).volume != 0.0f);'
            - lambda: 'return !(id(louder_mediaplayer).is_muted());'
          then:
            - media_player.volume_down

button:
  - platform: restart
    id: restart_btn
    name: "${friendly_name} REBOOT"

spi:
  clk_pin: ${pn532_sclk}
  mosi_pin: ${pn532_mosi}
  miso_pin: ${pn532_miso}

text_sensor:
  - platform: template
    name: "RFID Jukebox Tag"
    id: rfid_tag_uid
    icon: "mdi:rfid"

pn532_spi:
  cs_pin: ${pn532_cs}
  update_interval: 300ms

  on_tag:
    then:
      - lambda: id(tag_present) = true;
      - text_sensor.template.publish:
          id: rfid_tag_uid
          state: !lambda 'return x;'

  on_tag_removed:
    then:
      - lambda: id(tag_present) = false;
      - text_sensor.template.publish:
          id: rfid_tag_uid
          state: "Unknown"

